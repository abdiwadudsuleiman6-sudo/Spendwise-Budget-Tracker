<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendwise - Budget Tracker</title>
    <!-- Part 4: Linking your exact stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1 - Page structure -->
    <header>
        <h1>Spendwise</h1>
        <p>Welcome to my expense tracking application.</p>
    </header>

    <main>
        <!-- Part 2 - The "Add Expense" section -->
        <section id="add-expense-section">
            <h2>Add Expense</h2>
            
            <div class="form-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="e.g., Groceries">
            </div>

            <div class="form-group">
                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="expense-category">Category:</label>
                <select id="expense-category">
                    <option value="">-- Select Category --</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="entertainment">Entertainment</option>
                </select>
            </div>
            
            <button type="button">Add</button>
        </section>

        <!-- Part 3 - The "Your Expenses" placeholder -->
        <section id="expenses-display-section">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses yet</p>
        </section>
    </main>

</body>
</html>
